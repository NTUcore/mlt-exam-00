            deleteBtn: "Delete",

    const SEAT_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    const SEAT_NUMBERS = Array.from({length: 39}, (_, i) => i + 1);

    const App = () => {
        const [lang, setLang] = useState('AR');
        const [user, setUser] = useState(null);
        const [view, setView] = useState('login');
        const [onlineCount, setOnlineCount] = useState(0);
        const [theme, setTheme] = useState('dark');

        const T = TRANSLATIONS[lang];

        useEffect(() => {
            document.body.setAttribute('data-theme', theme);
        }, [theme]);

        // CRITICAL PERFORMANCE FIX FOR 400 STUDENTS
        // 1. Heartbeat increased to 5 minutes to reduce writes
        // 2. onSnapshot only runs for ADMIN to prevent 400x400 reads
        useEffect(() => {
            if (!user) return;
            
            // Reduced heartbeat frequency to protect quota (5 mins)
            const heartbeat = setInterval(() => {
                if (user && user.role !== 'admin') {
                    try {
                        window.FB.updateDoc(window.FB.doc(window.FB.db, "users", user.name), {
                            lastSeen: window.FB.serverTimestamp()
                        });
                    } catch(e) {}
                }
            }, 300000); // 300000ms = 5 minutes

            let unsub = () => {};

            // Only ADMIN listens to all users status
            if (user.role === 'admin') {
                const q = window.FB.query(window.FB.collection(window.FB.db, "users"));
                unsub = window.FB.onSnapshot(q, (snap) => {
                    const now = new Date();
                    const activeThreshold = 6 * 60 * 1000; // Slightly larger window for 5min heartbeat
                    const count = snap.docs.filter(doc => {
                        const data = doc.data();
                        if (data.role === 'admin') return false;
                        if (data.lastSeen) {
                            const lastSeenDate = data.lastSeen.toDate();
                            return (now - lastSeenDate) < activeThreshold;
                        }
                        return false;
                    }).length;
                    setOnlineCount(count);
                });
            } else {
                // Students see static 1 (themselves) to save reads
                setOnlineCount(1);
            }

            return () => { clearInterval(heartbeat); unsub(); };
        }, [user]);

        const handleLogin = (userData) => { setUser(userData); setView('dashboard'); };
        const handleLogout = () => { setUser(null); setView('login'); };

        return (
            <div className="min-h-screen p-4 flex flex-col items-center justify-center relative">
                
                {view === 'login' && (
                    <div className="absolute top-4 right-4 z-50">
                        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="sun-toggle">
                            {theme === 'dark' ? '☀️' : '🌙'}
                        </button>
                    </div>
                )}

                {view === 'login' && <Login T={T} lang={lang} setLang={setLang} onLogin={handleLogin} />}
                {view !== 'login' && user && (
                    <div className="w-full max-w-4xl space-y-8 animate-fade">
                        <header className="flex justify-between items-center p-6 rounded-2xl border-b border-blue-900/50 backdrop-blur-md" style={{background: 'var(--header-bg)'}}>
                            <div className="flex items-center gap-4">
                                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="sun-toggle">
                                    {theme === 'dark' ? '☀️' : '🌙'}
                                </button>
                                <h2 className="font-bold font-mono text-lg" style={{color: 'var(--text-main)'}}>{user.name}</h2>
                            </div>
                            
                            <div className="online-status">
                                <div className="online-dot"></div>
                                <span className="font-mono">{onlineCount} {T.online}</span>
                            </div>

                            <button onClick={handleLogout} className="text-red-500 font-bold border border-red-900/50 px-6 py-2 rounded-xl text-sm hover:bg-red-950/30 transition-colors">
                                {T.logout}
                            </button>
                        </header>

                        {view === 'dashboard' && <Dashboard T={T} user={user} setView={setView} />}
                        {view === 'members' && <MembersLog T={T} setView={setView} />}
                        {view === 'create' && <CreateExam T={T} user={user} setView={setView} />}
                        {view === 'hall' && <ExamHall T={T} user={user} setView={setView} />}
                        {view === 'leaderboard' && <Leaderboard T={T} setView={setView} user={user} />}
                    </div>
                )}
            </div>
        );
    };

    const Login = ({ T, lang, setLang, onLogin }) => {
        const [step, setStep] = useState(1);
        const [seat, setSeat] = useState({ L: 'A', N: '1' });
        const [pass, setPass] = useState('');
        const [confirm, setConfirm] = useState('');
        const [err, setErr] = useState('');
        const [adminMode, setAdminMode] = useState(false);
        const [adminName, setAdminName] = useState('');
        const [taken, setTaken] = useState(false);
        const [loading, setLoading] = useState(false);

        const check = async () => {
            setErr(''); setLoading(true);
            try {
                if (adminMode) {
                    if (adminName.trim().toLowerCase() === atob(_AK)) setStep(2);
                    else setErr("Admin Not Found");
                } else {
                    const id = `${seat.L}${seat.N}`;
                    const userDoc = await window.FB.getDoc(window.FB.doc(window.FB.db, "users", id));
                    setTaken(userDoc.exists());
                    setErr(userDoc.exists() ? T.seatTaken : T.seatFree);
                    setStep(2);
                }
            } catch (e) { setErr("Network Error"); }
            setLoading(false);
        };

        const submit = async () => {
            setLoading(true);
            try {
                if (adminMode) {
                    if (pass === atob(_PK)) onLogin({ name: adminName, role: 'admin' });
                    else setErr("Wrong Admin Password");
                } else {
                    const id = `${seat.L}${seat.N}`;
                    const userRef = window.FB.doc(window.FB.db, "users", id);
                    const userDoc = await window.FB.getDoc(userRef);
                    if (userDoc.exists()) {
                        if (userDoc.data().password === pass) {
                             await window.FB.updateDoc(userRef, { lastSeen: window.FB.serverTimestamp() });
                             // Log entry
                             await window.FB.addDoc(window.FB.collection(window.FB.db, "member_logs"), {
                                name: id,
                                date: new Date().toLocaleDateString(),
                                time: new Date().toLocaleTimeString(),
                                timestamp: window.FB.serverTimestamp()
                             });
                             onLogin({ name: id, ...userDoc.data(), role: 'student' });
                        } else setErr(T.wrongPass);
                    } else {
                        if (!pass || pass !== confirm) { setErr("Password Mismatch"); setLoading(false); return; }
                        const newUser = { password: pass, role: 'student', createdAt: new Date(), lastSeen: window.FB.serverTimestamp() };
                        await window.FB.setDoc(userRef, newUser);
                        // Log entry for new user
                        await window.FB.addDoc(window.FB.collection(window.FB.db, "member_logs"), {
                            name: id,
                            date: new Date().toLocaleDateString(),
                            time: new Date().toLocaleTimeString(),
                            timestamp: window.FB.serverTimestamp()
                         });
                        onLogin({ name: id, ...newUser });
                    }
                }
            } catch (e) { setErr("Database Error"); }
            setLoading(false);
        };

        return (
            <div className="animate-fade w-full max-w-xl mx-auto">
                <div className="flex justify-center gap-2 mb-6">
                    {['AR', 'KU', 'TR', 'EN'].map(l => (
                        <button key={l} onClick={() => setLang(l)} className={`px-4 py-2 rounded-xl font-bold text-xs border transition-all ${lang === l ? 'bg-red-800 text-white border-red-600' : 'bg-slate-900 text-gray-500 border-slate-700 hover:border-slate-500'}`}>{l}</button>
                    ))}
                </div>
                <div className="card-glow rounded-[2rem] p-10 text-center">
                    <p className="text-[#fbbf24] text-xl font-bold mb-6">{T.basmalah}</p>
                    <h2 className="font-bold mb-2 text-2xl" style={{color: 'var(--text-main)'}}>{T.gate}</h2>
                    <p className="text-sm mb-8" style={{color: 'var(--text-muted)'}}>{T.enterInfo}</p>
                    {step === 1 ? (
                        <div className="space-y-6">
                            {adminMode ? 
                                <input type="text" value={adminName} onChange={e => setAdminName(e.target.value)} className="w-full p-4 rounded-xl input-formal text-center" placeholder="Admin Name" /> :
                                <div className="flex gap-2">
                                    <select value={seat.L} onChange={e => setSeat({...seat, L: e.target.value})} className="w-1/2 p-4 rounded-xl input-formal text-xl font-bold">{SEAT_LETTERS.map(l => <option key={l}>{l}</option>)}</select>
                                    <select value={seat.N} onChange={e => setSeat({...seat, N: e.target.value})} className="w-1/2 p-4 rounded-xl input-formal text-xl font-bold">{SEAT_NUMBERS.map(n => <option key={n}>{n}</option>)}</select>
                                </div>
                            }
                            <button onClick={check} disabled={loading} className="w-full bg-red-800 text-white p-4 rounded-xl font-bold hover:bg-red-700 transition-colors disabled:opacity-50">{loading ? '...' : T.btnContinue}</button>
                            <button onClick={() => setAdminMode(!adminMode)} className="text-2xl opacity-20 hover:opacity-100 transition-opacity">🗝️</button>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            <p className="text-blue-400 font-mono font-bold text-lg mb-2">{adminMode ? adminName : `${seat.L}${seat.N}`}</p>
                            <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder={T.passLabel} className="w-full p-4 rounded-xl input-formal text-center" />
                            {!taken && !adminMode && <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} placeholder="Confirm Password" className="w-full p-4 rounded-xl input-formal text-center" />}
                            {err && <p className={`text-sm font-bold ${err.includes('متاح') || err.includes('available') || err.includes('müsait') ? 'text-emerald-500' : 'text-red-500'}`}>{err}</p>}
                            <button onClick={submit} disabled={loading} className="w-full bg-blue-800 text-white p-4 rounded-xl font-bold hover:bg-blue-700 transition-colors disabled:opacity-50">{loading ? '...' : T.btnContinue}</button>
                            <button onClick={() => {setStep(1); setErr('');}} className="text-xs text-slate-500 underline hover:text-slate-300">{T.back}</button>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const Dashboard = ({ T, user, setView }) => {
        const items = [
            { id: 'create', label: T.menuCreate, icon: '📝', color: 'bg-red-950/40 border-red-900 hover:border-red-600', show: true },
            { id: 'hall', label: T.menuHall, icon: '🏛️', color: 'bg-blue-950/40 border-blue-900 hover:border-blue-600', show: true },
            { id: 'leaderboard', label: T.menuLeader, icon: '🏆', color: 'bg-emerald-950/40 border-emerald-900 hover:border-emerald-600', show: true },
            { id: 'members', label: T.menuMembers, icon: '👥', color: 'bg-slate-900 border-slate-700 hover:border-slate-500', show: user.role === 'admin' }
        ];
        return (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade">
                {items.filter(i => i.show).map(item => (
                    <button key={item.id} onClick={() => setView(item.id)} className={`p-8 rounded-3xl border flex flex-col items-center gap-4 btn-action ${item.color} backdrop-blur-sm`}>
                        <span className="text-6xl">{item.icon}</span>
                        <span className="font-bold text-lg" style={{color: 'var(--text-main)'}}>{item.label}</span>
                    </button>
                ))}
            </div>
        );
    };

    const MembersLog = ({ T, setView }) => {
        const [logs, setLogs] = useState([]);
        const [userPasswords, setUserPasswords] = useState({});
        useEffect(() => {
            let unsubLogs = () => {};
            // Limit logs to last 50 to prevent massive reads
            const q = window.FB.query(window.FB.collection(window.FB.db, "member_logs"), window.FB.orderBy('timestamp', 'desc'), window.FB.limit(50));
            unsubLogs = window.FB.onSnapshot(q, (snap) => {
                setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });
            const fetchUsers = async () => {
                const uSnap = await window.FB.getDocs(window.FB.collection(window.FB.db, "users"));
                const passMap = {};
                uSnap.forEach(doc => { passMap[doc.id] = doc.data().password; });
                setUserPasswords(passMap);
            };
            fetchUsers();
            return () => unsubLogs();
        }, []);
        return (
            <div className="card-glow rounded-3xl p-8 animate-fade w-full">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                    <h2 className="text-xl font-bold" style={{color: 'var(--text-main)'}}>{T.menuMembers}</h2>
                    <button onClick={() => setView('dashboard')} className="font-bold hover:text-slate-300 transition-colors" style={{color: 'var(--text-muted)'}}>{T.back}</button>
                </div>
                <div className="overflow-x-auto">
                    <table className="w-full text-right">
                        <thead><tr className="text-sm font-bold" style={{color: 'var(--text-muted)'}}><th className="p-4">الرمز</th><th className="p-4">{T.passHeader}</th><th className="p-4">التاريخ</th><th className="p-4">الوقت</th></tr></thead>
                        <tbody style={{color: 'var(--text-main)'}}>
                            {logs.map(log => (
                                <tr key={log.id} className="border-b border-slate-800/40 hover:bg-white/5 transition-colors">
                                    <td className="p-4 font-mono font-bold">{log.name}</td>
                                    <td className="p-4 text-blue-400 font-bold">{userPasswords[log.name] || '----'}</td>
                                    <td className="p-4">{log.date}</td>
                                    <td className="p-4 text-emerald-500 font-bold">{log.time}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );
    };

    const CreateExam = ({ T, user, setView }) => {
        const [sub, setSub] = useState('');
        const [raw, setRaw] = useState('');
        const [loading, setLoading] = useState(false);
        const publish = async () => {
            if (!sub || !raw) return;
            setLoading(true);
            try {
                const qs = raw.split(/q:/i).filter(b => b.trim()).map(b => {
                    const lines = b.trim().split('\n');
                    let qText = lines[0];
                    let opts = lines.slice(1).map(l => l.replace('✅', '').trim());
                    let correct = lines.slice(1).findIndex(l => l.includes('✅'));
                    return { text: qText, options: opts, correct: correct === -1 ? 0 : correct };
                });
                await window.FB.addDoc(window.FB.collection(window.FB.db, "exams"), { subject: sub, author: user.name, questions: qs, timestamp: window.FB.serverTimestamp() });
                setView('dashboard');
            } catch (e) { alert("Error."); }
            setLoading(false);
        };
        return (
            <div className="card-glow rounded-3xl p-8 animate-fade w-full max-w-2xl mx-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                    <h2 className="text-xl font-bold" style={{color: 'var(--text-main)'}}>{T.menuCreate}</h2>
                    <button onClick={() => setView('dashboard')} className="font-bold" style={{color: 'var(--text-muted)'}}>{T.back}</button>
                </div>
                <div className="space-y-4">
                    <input value={sub} onChange={e => setSub(e.target.value)} className="w-full p-4 rounded-xl input-formal" placeholder={T.subject} />
                    <textarea value={raw} onChange={e => setRaw(e.target.value)} className="w-full h-64 p-4 rounded-xl input-formal font-mono" placeholder="q: Question?&#10;Option 1 ✅&#10;Option 2"></textarea>
                    <button onClick={publish} disabled={loading} className="w-full bg-red-800 text-white p-4 rounded-xl font-bold hover:bg-red-700 transition-colors disabled:opacity-50">{loading ? '...' : T.publish}</button>
                </div>
            </div>
        );
    };

    const ExamHall = ({ T, user, setView }) => {
        const [active, setActive] = useState(null);
        const [exams, setExams] = useState([]);
        useEffect(() => {
            const q = window.FB.query(window.FB.collection(window.FB.db, "exams"));
            const unsub = window.FB.onSnapshot(q, (snap) => {
                setExams(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });
            return () => unsub();
        }, []);
        const deleteExam = async (e, examId) => {
            e.stopPropagation();
            if (!confirm(T.delConfirm)) return;
            await window.FB.deleteDoc(window.FB.doc(window.FB.db, "exams", examId));
        };
        if (active) return <TakeExam T={T} user={user} exam={active} exit={() => setActive(null)} />;
        return (
            <div className="card-glow rounded-3xl p-8 animate-fade w-full">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                    <h2 className="text-xl font-bold" style={{color: 'var(--text-main)'}}>{T.menuHall}</h2>
                    <button onClick={() => setView('dashboard')} className="font-bold" style={{color: 'var(--text-muted)'}}>{T.back}</button>
                </div>
                <div className="grid gap-4">
                    {exams.map(e => (
                        <div key={e.id} className="p-6 rounded-2xl border-r-4 border-blue-600 flex justify-between items-center relative group backdrop-blur-sm" style={{background: 'var(--input-bg)'}}>
                            <span className="font-bold text-lg" style={{color: 'var(--text-main)'}}>{e.subject}</span>
                            <div className="flex gap-2">
                                <button onClick={() => setActive(e)} className="bg-blue-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">{T.startBtn}</button>
                                {(user.role === 'admin' || user.name === e.author) && (
                                    <button onClick={(ev) => deleteExam(ev, e.id)} className="bg-red-900/30 hover:bg-red-600 text-red-200 px-4 py-2 rounded-xl text-xs font-bold border border-red-900/50 transition-all">{T.deleteBtn}</button>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );
    };

    const TakeExam = ({ T, user, exam, exit }) => {
        const [idx, setIdx] = useState(0);
        const [score, setScore] = useState(0);
        const [done, setDone] = useState(false);
        const [ans, setAns] = useState(null);
        const [timer, setTimer] = useState(60);
        const [start] = useState(Date.now());
        const [attempts, setAttempts] = useState(0);
        const current = exam.questions[idx];

        useEffect(() => {
            if (done) return;
            setTimer(60);
            const t = setInterval(() => {
                setTimer(p => {
                    if (p <= 1) { clearInterval(t); if (ans === null) setAns(-1); return 0; }
                    return p - 1;
                });
            }, 1000);
            if (ans !== null) clearInterval(t);
            return () => clearInterval(t);
        }, [idx, ans, done]);

        const handle = (i) => { if (ans !== null) return; setAns(i); setAttempts(a => a + 1); if (i === current.correct) setScore(s => s + 1); };
        
        const next = async () => {
            if (idx + 1 < exam.questions.length) { 
                setIdx(idx + 1); 
                setAns(null); 
            } else {
                setDone(true);
                // Save Result
                if (user.role === 'student') {
                    await window.FB.addDoc(window.FB.collection(window.FB.db, "exam_results"), {
                        student: user.name,
                        examId: exam.id,
                        subject: exam.subject,
                        score: score + (ans === current.correct ? 1 : 0),
                        total: exam.questions.length,
                        timestamp: window.FB.serverTimestamp()
                    });
                }
            }
        };

        if (done) return (
            <div className="card-glow rounded-3xl p-10 animate-fade text-center w-full max-w-xl mx-auto">
                <span className="text-6xl mb-4 block">🎉</span>
                <h2 className="text-3xl font-bold mb-4" style={{color: 'var(--text-main)'}}>{T.examDone}</h2>
                <div className="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-6">
                    {score + (ans === current.correct ? 1 : 0)} / {exam.questions.length}
                </div>
                <button onClick={exit} className="bg-slate-700 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-600 transition-all">{T.back}</button>
            </div>
        );

        return (
            <div className="w-full max-w-3xl mx-auto animate-fade">
                <div className="card-glow rounded-3xl p-8 relative overflow-hidden">
                    <div className="absolute top-0 left-0 h-2 bg-blue-600 transition-all duration-1000" style={{width: `${((idx+1)/exam.questions.length)*100}%`}}></div>
                    <div className="flex justify-between items-center mb-8">
                        <span className="font-bold text-xl text-blue-400">{T.subject}: {exam.subject}</span>
                        <div className="flex items-center gap-2">
                            <span className="font-mono text-2xl font-bold" style={{color: timer < 10 ? 'var(--spider-red)' : 'var(--text-main)'}}>{timer}s</span>
                            <span className="text-2xl">⏱️</span>
                        </div>
                    </div>
                    
                    <h3 className="text-2xl font-bold mb-8 leading-relaxed text-right" style={{color: 'var(--text-main)'}}>{current.text}</h3>

                    <div className="grid gap-4">
                        {current.options.map((opt, i) => (
                            <button key={i} onClick={() => handle(i)} 
                                className={`p-6 rounded-2xl text-right font-bold text-lg transition-all border
                                    ${ans === null ? 'bg-slate-800/50 border-slate-700 hover:border-blue-500 hover:bg-blue-900/20' : 
                                      i === current.correct ? 'bg-emerald-900/40 border-emerald-500 text-emerald-400' : 
                                      i === ans ? 'bg-red-900/40 border-red-500 text-red-400' : 'opacity-50 border-transparent'}
                                `}>
                                {opt}
                            </button>
                        ))}
                    </div>

                    {ans !== null && (
                        <div className="mt-8 flex justify-end">
                             <button onClick={next} className="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-500 transition-all animate-fade">{idx + 1 === exam.questions.length ? T.finishExam : T.nextQ} →</button>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const Leaderboard = ({ T, setView, user }) => {
        const [ranks, setRanks] = useState([]);
        
        useEffect(() => {
            // Smart Query: Order by score to get top students immediately
            const q = window.FB.query(window.FB.collection(window.FB.db, "exam_results"), window.FB.orderBy('score', 'desc'), window.FB.limit(20));
            const unsub = window.FB.onSnapshot(q, (snap) => {
                const data = snap.docs.map(d => d.data());
                // Aggregate scores if needed, for now just showing top exam results
                setRanks(data);
            });
            return () => unsub();
        }, []);

        return (
            <div className="card-glow rounded-3xl p-8 animate-fade w-full max-w-3xl mx-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                    <h2 className="text-xl font-bold" style={{color: 'var(--text-main)'}}>{T.menuLeader}</h2>
                    <button onClick={() => setView('dashboard')} className="font-bold hover:text-slate-300 transition-colors" style={{color: 'var(--text-muted)'}}>{T.back}</button>
                </div>
                
                <div className="space-y-4">
                    <div className="flex justify-between px-6 text-sm font-bold" style={{color: 'var(--text-muted)'}}>
                        <span>{T.student}</span>
                        <span>{T.score}</span>
                    </div>
                    {ranks.map((r, i) => (
                        <div key={i} className={`flex justify-between items-center p-4 rounded-xl ${i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'bg-slate-800/30'}`}>
                            <div className="flex items-center gap-4">
                                <span className="font-mono font-bold w-8">{i+1}</span>
                                <div className="flex flex-col">
                                    <span className="font-bold">{r.student}</span>
                                    <span className="text-xs opacity-70">{r.subject}</span>
                                </div>
                            </div>
                            <span className="font-mono font-bold text-xl">{r.score}</span>
                        </div>
                    ))}
                    {ranks.length === 0 && <p className="text-center py-8 opacity-50">No records yet...</p>}
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
