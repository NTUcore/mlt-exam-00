        .timer-bar { height: 4px; background: #10b981; transition: width 1s linear; }
        
        .sun-toggle {

                bubbleLeft: "بەشی هەڵبژاردن", bubbleRight: "بەشی ڕاست و هەڵە", submitBubble: "ناردنی وەرەقەی بڵ شیت", questionsArea: "پرسیارەکان", bubbleArea: "OMR ANSWER SHEET"
            },
            EN: {

                seatTaken: "Seat taken, enter code to login", seatFree: "Seat available! Set your code",
                wrongPass: "Incorrect code! Access denied", finishExam: "Finish Exam", totalTimeText: "Total Time",
                attempts: "Attempts", startBtn: "Start Exam", passHeader: "Password", delConfirm: "Are you sure you want to delete?",
                deleteBtn: "Delete", score: "Score", noExams: "No exams available", noResults: "No results for this subject",
                chooseMode: "Choose Exam Mode", normalMode: "Normal (One by one)", bubbleMode: "Bubble Sheet (Full Page)",
                bubbleLeft: "Multiple Choice", bubbleRight: "True / False", submitBubble: "Submit Bubble Sheet", questionsArea: "Questions", bubbleArea: "OMR ANSWER SHEET"
            },
            TR: {
                basmalah: "Bizi yaratan ve O'na döneceğimiz Allah'ın adıyla",
                gate: "Giriş Portalı", enterInfo: "Sisteme erişmek için lütfen koltuğunuzu seçin",
                labelSeat: "Koltuk Numarası", btnContinue: "Devam Et", passLabel: "Giriş Kodu",
                createPass: "Bu koltuk için şifre oluştur", menuMembers: "Üye Kayıtları", menuCreate: "Sınav Oluştur",
                menuHall: "Sınav Salonu", menuLeader: "Liderlik Tablosu", subject: "Ders Adı", publish: "Sınavı Yayınla",
                back: "Geri", examDone: "Sınav başarıyla tamamlandı", nextQ: "Sonraki Soru", logout: "Çıkış Yap",
                seatTaken: "Koltuk dolu, giriş için kod girin", seatFree: "Koltuk müsait! Kodunuzu belirleyin",
                wrongPass: "Yanlış kod! Erişim reddedildi", finishExam: "Sınavı Bitir", totalTimeText: "Toplam Süre",
                attempts: "Denemeler", startBtn: "Sınava Başla", passHeader: "Şifre", delConfirm: "Silmek istediğinizden emin misiniz?",
                deleteBtn: "Sil", score: "Puan", noExams: "Mevcut sınav yok", noResults: "Bu ders için sonuç yok",
                chooseMode: "Sınav Modu Seç", normalMode: "Normal (Sırayla)", bubbleMode: "Optik Form (Tam Sayfa)",
                bubbleLeft: "Çoktan Seçmeli", bubbleRight: "Doğru / Yanlış", submitBubble: "Formu Gönder", questionsArea: "Sorular", bubbleArea: "OMR ANSWER SHEET"
            }
        };

        const SEAT_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
        const SEAT_NUMBERS = Array.from({ length: 39 }, (_, i) => i + 1);

        const App = () => {
            const [lang, setLang] = useState('AR');
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [theme, setTheme] = useState('dark');
            const [authLoading, setAuthLoading] = useState(true);

            const T = TRANSLATIONS[lang] || TRANSLATIONS['AR'];

            useEffect(() => {
                document.body.setAttribute('data-theme', theme);
            }, [theme]);

            useEffect(() => {
                const unsubscribe = window.FB.onAuthStateChanged(window.FB.auth, (firebaseUser) => {
                    const savedData = localStorage.getItem('app_user_session');
                    if (firebaseUser && savedData) {
                        setUser(JSON.parse(savedData));
                        setView('dashboard');
                    } else if (!firebaseUser) {
                        window.FB.signInAnonymously(window.FB.auth).catch(() => { });
                    }
                    authLoading && setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogin = useCallback((userData) => {
                setUser(userData);
                setView('dashboard');
                localStorage.setItem('app_user_session', JSON.stringify(userData));
            }, []);

            const handleLogout = useCallback(() => {
                window.FB.auth.signOut();
                localStorage.removeItem('app_user_session');
                setUser(null);
                setView('login');
            }, []);

            if (authLoading) return null;

            return (
                <div className="min-h-screen p-4 flex flex-col items-center justify-center relative">
                    {view === 'login' && <Login T={T} lang={lang} setLang={setLang} onLogin={handleLogin} setTheme={setTheme} theme={theme} />}
                    {view !== 'login' && user && (
                        <div className="w-full max-w-6xl space-y-8 animate-fade">
                            <header className="flex justify-between items-center p-6 rounded-2xl backdrop-blur-md" style={{ background: 'var(--header-bg)' }}>
                                <div className="flex items-center gap-4">
                                    <h2 className="font-bold font-mono text-lg" style={{ color: 'var(--text-main)' }}>{user.name}</h2>
                                </div>
                                
                                <div className="absolute left-1/2 -translate-x-1/2 top-10 flex gap-2">
                                     {['AR', 'KU', 'EN', 'TR'].map(l => (
                                        <button key={l} onClick={() => setLang(l)} className={`px-4 py-2 rounded-xl font-bold text-xs border ${lang === l ? 'bg-red-800 text-white border-red-600' : 'bg-slate-900 text-gray-500 border-slate-700'}`}>{l}</button>
                                    ))}
                                </div>

                                <div className="flex items-center gap-4">
                                    <button onClick={handleLogout} className="text-red-500 font-bold border border-red-900/50 px-6 py-2 rounded-xl text-sm hover:bg-red-950/30">
                                        {T.logout}
                                    </button>
                                    <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="sun-toggle">
                                        {theme === 'dark' ? '☀️' : '🌙'}
                                    </button>
                                </div>
                            </header>
                            {view === 'dashboard' && <Dashboard T={T} user={user} setView={setView} />}
                            {view === 'members' && <MembersLog T={T} setView={setView} />}
                            {view === 'create' && <CreateExam T={T} user={user} setView={setView} />}
                            {view === 'hall' && <ExamHall T={T} user={user} setView={setView} />}
                            {view === 'leaderboard' && <Leaderboard T={T} setView={setView} user={user} />}
                        </div>
                    )}
                </div>
            );
        };

        const Login = ({ T, lang, setLang, onLogin, setTheme, theme }) => {
            const [step, setStep] = useState(1);
            const [seat, setSeat] = useState({ L: 'A', N: '1' });
            const [pass, setPass] = useState('');
            const [confirm, setConfirm] = useState('');
            const [err, setErr] = useState('');
            const [adminMode, setAdminMode] = useState(false);
            const [adminName, setAdminName] = useState('');
            const [taken, setTaken] = useState(false);
            const [loading, setLoading] = useState(false);

            const check = async () => {
                setErr('');
                if (adminMode && !adminName.trim()) return;
                setLoading(true);
                try {
                    if (adminMode) {
                        if (adminName.trim().toLowerCase() === atob(_AK)) setStep(2);
                        else setErr("Admin Not Found");
                    } else {
                        const id = `${seat.L}${seat.N}`;
                        const userDoc = await window.FB.getDoc(window.FB.doc(window.FB.db, "users", id));
                        setTaken(userDoc.exists());
                        setErr(userDoc.exists() ? T.seatTaken : T.seatFree);
                        setStep(2);
                    }
                } catch (e) { setErr("Connection Error"); }
                setLoading(false);
            };

            const submit = async () => {
                setLoading(true);
                try {
                    if (!window.FB.auth.currentUser) await window.FB.signInAnonymously(window.FB.auth);
                    if (adminMode) {
                        if (pass === atob(_PK)) onLogin({ name: adminName, role: 'admin' });
                        else setErr("Wrong Password");
                    } else {
                        const id = `${seat.L}${seat.N}`;
                        const userRef = window.FB.doc(window.FB.db, "users", id);
                        const userDoc = await window.FB.getDoc(userRef);
                        if (userDoc.exists()) {
                            if (userDoc.data().password === pass) onLogin({ name: id, ...userDoc.data(), role: 'student' });
                            else setErr(T.wrongPass);
                        } else {
                            if (!pass || pass !== confirm) { setErr("Password Mismatch"); setLoading(false); return; }
                            const newUser = { password: pass, role: 'student', createdAt: new Date() };
                            await window.FB.setDoc(userRef, newUser);
                            const now = new Date();
                            window.FB.addDoc(window.FB.collection(window.FB.db, "member_logs"), {
                                name: id, date: now.toLocaleDateString('en-GB'), time: now.toLocaleTimeString('en-GB'), timestamp: window.FB.serverTimestamp()
                            });
                            onLogin({ name: id, ...newUser, role: 'student' });
                        }
                    }
                } catch (e) { setErr("Server Busy"); }
                setLoading(false);
            };

            return (
                <div className="animate-fade w-full max-w-xl mx-auto">
                    <div className="absolute top-10 left-1/2 -translate-x-1/2 flex gap-2">
                        {['AR', 'KU', 'EN', 'TR'].map(l => (
                            <button key={l} onClick={() => setLang(l)} className={`px-4 py-2 rounded-xl font-bold text-xs border ${lang === l ? 'bg-red-800 text-white border-red-600' : 'bg-slate-900 text-gray-500 border-slate-700'}`}>{l}</button>
                        ))}
                    </div>

                    <div className="card-glow rounded-[2rem] p-10 text-center mt-20">
                        <p className="text-[#fbbf24] text-xl font-bold mb-6">{T.basmalah}</p>
                        <h2 className="font-bold mb-2 text-2xl">{T.gate}</h2>
                        <p className="text-sm mb-8 text-slate-400">{T.enterInfo}</p>
                        {step === 1 ? (
                            <div className="space-y-6">
                                {adminMode ?
                                    <input type="text" value={adminName} onChange={e => setAdminName(e.target.value)} className="w-full p-4 rounded-xl input-formal text-center" placeholder="Admin Name" /> :
                                    <div className="flex gap-2">
                                        <select value={seat.L} onChange={e => setSeat({ ...seat, L: e.target.value })} className="w-1/2 p-4 rounded-xl input-formal font-bold">{SEAT_LETTERS.map(l => <option key={l}>{l}</option>)}</select>
                                        <select value={seat.N} onChange={e => setSeat({ ...seat, N: e.target.value })} className="w-1/2 p-4 rounded-xl input-formal font-bold">{SEAT_NUMBERS.map(n => <option key={n}>{n}</option>)}</select>
                                    </div>
                                }
                                <button onClick={check} disabled={loading} className="w-full bg-red-800 text-white p-4 rounded-xl font-bold">{loading ? '...' : T.btnContinue}</button>
                                <button onClick={() => setAdminMode(!adminMode)} className="text-2xl opacity-20">🗝️</button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <p className="text-blue-400 font-mono font-bold text-lg">{adminMode ? adminName : `${seat.L}${seat.N}`}</p>
                                <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder={T.passLabel} className="w-full p-4 rounded-xl input-formal text-center" />
                                {!taken && !adminMode && <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} placeholder="Confirm Password" className="w-full p-4 rounded-xl input-formal text-center" />}
                                {err && <p className={`text-sm font-bold ${err.includes('متاح') || err.includes('available') || err.includes('müsait') ? 'text-emerald-500' : 'text-red-500'}`}>{err}</p>}
                                <button onClick={submit} disabled={loading} className="w-full bg-blue-800 text-white p-4 rounded-xl font-bold">{loading ? '...' : T.btnContinue}</button>
                                <button onClick={() => { setStep(1); setErr(''); }} className="text-xs text-slate-500 underline">{T.back}</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Dashboard = ({ T, user, setView }) => {
            const items = [
                { id: 'create', label: T.menuCreate, icon: '📝', color: 'bg-red-950/40 border-red-900', show: true }, // Enabled for both admin and student
                { id: 'hall', label: T.menuHall, icon: '🏛️', color: 'bg-blue-950/40 border-blue-900', show: true },
                { id: 'leaderboard', label: T.menuLeader, icon: '🏆', color: 'bg-emerald-950/40 border-emerald-900', show: true },
                { id: 'members', label: T.menuMembers, icon: '👥', color: 'bg-slate-900 border-slate-700', show: user.role === 'admin' }
            ];
            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {items.filter(i => i.show).map(item => (
                        <button key={item.id} onClick={() => setView(item.id)} className={`p-8 rounded-3xl border flex flex-col items-center gap-4 ${item.color}`}>
                            <span className="text-6xl">{item.icon}</span>
                            <span className="font-bold text-lg">{item.label}</span>
                        </button>
                    ))}
                </div>
            );
        };

        const MembersLog = ({ T, setView }) => {
            const [logs, setLogs] = useState([]);
            const [userPasswords, setUserPasswords] = useState({});
            useEffect(() => {
                const q = window.FB.query(window.FB.collection(window.FB.db, "member_logs"), window.FB.orderBy("timestamp", "desc"));
                const unsubLogs = window.FB.onSnapshot(q, (snap) => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const fetchUsers = async () => {
                    const uSnap = await window.FB.getDocs(window.FB.collection(window.FB.db, "users"));
                    const passMap = {};
                    uSnap.forEach(doc => { passMap[doc.id] = doc.data().password; });
                    setUserPasswords(passMap);
                };
                fetchUsers();
                return () => unsubLogs();
            }, []);
            return (
                <div className="card-glow rounded-3xl p-8 w-full overflow-hidden">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                        <h2 className="text-xl font-bold">{T.menuMembers}</h2>
                        <button onClick={() => setView('dashboard')} className="font-bold text-slate-400">{T.back}</button>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-right">
                            <thead><tr className="text-sm font-bold text-slate-500"><th className="p-4">المقعد</th><th className="p-4">الرمز</th><th className="p-4">التاريخ</th><th className="p-4">الوقت</th></tr></thead>
                            <tbody>
                                {logs.map(log => (
                                    <tr key={log.id} className="border-b border-slate-800/40">
                                        <td className="p-4 font-bold">{log.name}</td>
                                        <td className="p-4 text-blue-400 font-bold">{userPasswords[log.name] || '----'}</td>
                                        <td className="p-4">{log.date}</td>
                                        <td className="p-4 text-emerald-500 font-bold">{log.time}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const CreateExam = ({ T, user, setView }) => {
            const [sub, setSub] = useState('');
            const [raw, setRaw] = useState('');
            const [loading, setLoading] = useState(false);
            const publish = async () => {
                if (!sub || !raw) return;
                setLoading(true);
                try {
                    const qs = raw.split(/q:/i).filter(b => b.trim()).map(b => {
                        const lines = b.trim().split('\n');
                        let qText = lines[0];
                        let opts = lines.slice(1)
                            .map(l => l.replace('✅', '').trim())
                            .filter(l => l !== ""); 
                        
                        let correctIndex = lines.slice(1).findIndex(l => l.includes('✅'));
                        return { text: qText, options: opts, correct: correctIndex === -1 ? 0 : correctIndex };
                    });
                    await window.FB.addDoc(window.FB.collection(window.FB.db, "exams"), { 
                        subject: sub, 
                        author: user.name, 
                        authorRole: user.role, // Added to distinguish
                        questions: qs, 
                        timestamp: window.FB.serverTimestamp() 
                    });
                    setView('dashboard');
                } catch (e) { }
                setLoading(false);
            };
            return (
                <div className="card-glow rounded-3xl p-8 max-w-2xl mx-auto">
                    <h2 className="text-xl font-bold mb-6 border-b border-slate-800 pb-4">{T.menuCreate}</h2>
                    <div className="space-y-4">
                        <input value={sub} onChange={e => setSub(e.target.value)} className="w-full p-4 rounded-xl input-formal" placeholder={T.subject} />
                        <textarea value={raw} onChange={e => setRaw(e.target.value)} className="w-full h-64 p-4 rounded-xl input-formal font-mono" placeholder="q: Question?&#10;Option 1 ✅&#10;Option 2"></textarea>
                        <button onClick={publish} disabled={loading} className="w-full bg-red-800 text-white p-4 rounded-xl font-bold">{loading ? '...' : T.publish}</button>
                        <button onClick={() => setView('dashboard')} className="w-full text-slate-500 font-bold">{T.back}</button>
                    </div>
                </div>
            );
        };

        const ExamHall = ({ T, user, setView }) => {
            const [active, setActive] = useState(null);
            const [mode, setMode] = useState(null);
            const [exams, setExams] = useState([]);

            useEffect(() => {
                const q = window.FB.query(window.FB.collection(window.FB.db, "exams"), window.FB.orderBy("timestamp", "desc"));
                const unsub = window.FB.onSnapshot(q, (snap) => setExams(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsub();
            }, []);

            const del = async (e, id) => {
                e.stopPropagation();
                if (window.confirm(T.delConfirm)) await window.FB.deleteDoc(window.FB.doc(window.FB.db, "exams", id));
            };

            // Check if user can delete this specific exam
            const canDelete = (exam) => {
                if (user.role === 'admin') return true; // Admin deletes everything
                return exam.author === user.name; // Student deletes only their own
            };

            if (active && mode === 'normal') return <TakeExam T={T} user={user} exam={active} exit={() => { setActive(null); setMode(null); }} />;
            if (active && mode === 'bubble') return <BubbleExam T={T} user={user} exam={active} exit={() => { setActive(null); setMode(null); }} />;

            if (active && !mode) {
                return (
                    <div className="card-glow rounded-[3rem] p-12 text-center space-y-8 max-w-xl mx-auto">
                        <h2 className="text-2xl font-bold">{T.chooseMode}</h2>
                        <div className="grid gap-4">
                            <button onClick={() => setMode('normal')} className="p-6 rounded-2xl border border-blue-600 bg-blue-950/20 hover:bg-blue-600 font-bold">{T.normalMode}</button>
                            <button onClick={() => setMode('bubble')} className="p-6 rounded-2xl border border-emerald-600 bg-emerald-950/20 hover:bg-emerald-600 font-bold">{T.bubbleMode}</button>
                        </div>
                        <button onClick={() => setActive(null)} className="text-slate-400 font-bold">{T.back}</button>
                    </div>
                );
            }

            return (
                <div className="card-glow rounded-3xl p-8 w-full">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                        <h2 className="text-xl font-bold">{T.menuHall}</h2>
                        <button onClick={() => setView('dashboard')} className="font-bold text-slate-400">{T.back}</button>
                    </div>
                    <div className="grid gap-4">
                        {exams.length > 0 ? exams.map(e => (
                            <div key={e.id} className={`p-6 rounded-2xl border-r-4 flex justify-between items-center bg-slate-900/40 ${e.authorRole === 'admin' ? 'border-red-600' : 'border-blue-600'}`}>
                                <div className="flex flex-col">
                                    <span className="font-bold text-lg">{e.subject}</span>
                                    <span className="text-[10px] text-slate-500 uppercase">By: {e.author} {e.authorRole === 'admin' ? '(Admin)' : ''}</span>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setActive(e)} className="bg-blue-800 text-white px-8 py-3 rounded-xl font-bold">{T.startBtn}</button>
                                    {canDelete(e) && <button onClick={(evt) => del(evt, e.id)} className="bg-red-900/30 text-red-200 px-4 py-2 rounded-xl text-xs font-bold">{T.deleteBtn}</button>}
                                </div>
                            </div>
                        )) : <p className="text-center text-slate-500 py-10">{T.noExams}</p>}
                    </div>
                </div>
            );
        };

        const TakeExam = ({ T, user, exam, exit }) => {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [done, setDone] = useState(false);
            const [ans, setAns] = useState(null);
            const [timer, setTimer] = useState(60);
            const [start] = useState(Date.now());
            
            const current = useMemo(() => {
                const q = exam.questions[idx];
                return { ...q, options: q.options.filter(o => o.trim() !== "") };
            }, [exam.questions, idx]);

            useEffect(() => {
                setTimer(60);
                const t = setInterval(() => {
                    setTimer(p => { if (p <= 1) { clearInterval(t); if (ans === null) setAns(-1); return 0; } return p - 1; });
                }, 1000);
                if (ans !== null) clearInterval(t);
                return () => clearInterval(t);
            }, [idx, ans]);

            const next = async () => {
                if (idx + 1 < exam.questions.length) { setIdx(idx + 1); setAns(null); }
                else {
                    const totalTimes = (Date.now() - start) / 1000;
                    await window.FB.addDoc(window.FB.collection(window.FB.db, "classroom"), { subject: exam.subject, student: user.name, score, total: exam.questions.length, totalTimes, timestamp: window.FB.serverTimestamp() });
                    setDone(true);
                }
            };

            if (done) return <div className="card-glow p-12 text-center rounded-[3rem] animate-fade"><h2 className="text-yellow-500 text-3xl font-bold mb-8">{T.examDone}</h2><div className="text-6xl font-black mb-10">{score} / {exam.questions.length}</div><button onClick={exit} className="bg-blue-800 text-white px-12 py-4 rounded-2xl font-bold">{T.back}</button></div>;
            return (
                <div className="w-full max-w-3xl mx-auto py-6 animate-fade">
                    <div className="flex justify-between text-blue-400 font-bold mb-4"><span>{exam.subject}</span><span>{idx + 1} / {exam.questions.length}</span></div>
                    <div className="w-full bg-slate-800 h-1.5 mb-6 rounded-full overflow-hidden">
                        <div className="timer-bar" style={{ width: `${(timer / 60) * 100}%`, background: timer < 10 ? '#ef4444' : '#10b981' }}></div>
                    </div>
                    <div className="card-glow rounded-[3rem] p-10 space-y-10 flex flex-col items-center">
                        <h3 className="text-3xl font-bold text-center">{current.text}</h3>
                        <div className="grid gap-4 w-full">
                            {current.options.map((opt, i) => (
                                <button key={i} onClick={() => ans === null && (setAns(i), i === current.correct && setScore(s => s + 1))} className={`w-full p-5 rounded-full text-center font-bold border-2 ${ans === null ?
                                    'hover:bg-white/5 border-slate-700' : (i === current.correct ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : (ans === i ? 'bg-red-500/20 border-red-500 text-red-400' : 'opacity-40 border-slate-800'))}`}>
                                    {opt}
                                </button>
                            ))}
                        </div>
                        {ans !== null && <button onClick={next} className="w-full bg-blue-700 text-white py-4 rounded-full font-bold text-xl">{idx + 1 === exam.questions.length ? T.finishExam : T.nextQ}</button>}
                    </div>
                </div>
            );
        };

        const BubbleExam = ({ T, user, exam, exit }) => {
            const [answers, setAnswers] = useState(new Array(exam.questions.length).fill(null));
            const [done, setDone] = useState(false);
            const [score, setScore] = useState(0);
            const [start] = useState(Date.now());
            const [loading, setLoading] = useState(false);

            const cleanQuestions = useMemo(() => {
                return exam.questions.map(q => ({
                    ...q,
                    options: q.options.filter(o => o.trim() !== "")
                }));
            }, [exam.questions]);

            const submit = async () => {
                setLoading(true);
                let finalScore = 0;
                answers.forEach((ans, i) => { if (ans === exam.questions[i].correct) finalScore++; });
                const totalTimes = (Date.now() - start) / 1000;
                await window.FB.addDoc(window.FB.collection(window.FB.db, "classroom"), { subject: exam.subject, student: user.name, score: finalScore, total: exam.questions.length, totalTimes, timestamp: window.FB.serverTimestamp() });
                setScore(finalScore); setDone(true); setLoading(false);
            };

            if (done) return <div className="card-glow p-12 text-center rounded-[3rem] animate-fade"><h2 className="text-yellow-500 text-3xl font-bold mb-8">{T.examDone}</h2><div className="text-6xl font-black mb-10">{score} / {exam.questions.length}</div><button onClick={exit} className="bg-blue-800 text-white px-12 py-4 rounded-2xl font-bold">{T.back}</button></div>;

            return (
                <div className="animate-fade w-full max-w-4xl mx-auto py-6 space-y-8">
                    <div className="card-glow rounded-3xl p-8 space-y-12">
                        <div className="flex justify-between items-center border-b border-slate-700 pb-4">
                            <h2 className="text-2xl font-bold text-blue-400">{exam.subject} - {T.questionsArea}</h2>
                            <span className="text-slate-400 font-bold">{exam.questions.length} {T.questionsArea}</span>
                        </div>
                        <div className="space-y-10">
                            {cleanQuestions.map((q, idx) => (
                                <div key={idx} className="pb-8 border-b border-slate-800/50 last:border-0">
                                    <h4 className="font-bold text-xl mb-6">
                                        <span className="bg-blue-600 text-white px-3 py-1 rounded-lg ml-3 text-sm">{idx + 1}</span>
                                        {q.text}
                                    </h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pr-10">
                                        {q.options.map((opt, oIdx) => (
                                            <div key={oIdx} className="flex items-center gap-3 p-3 rounded-xl bg-slate-800/30">
                                                <span className="font-bold text-blue-400 w-6">({String.fromCharCode(65 + oIdx)})</span>
                                                <span className="text-slate-200">{opt}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bubble-sheet-container">
                        <div className="omr-header">
                            <div className="flex flex-col gap-1">
                                <span className="font-bold">STUDENT ID: {user.name}</span>
                                <span className="text-[10px]">Medical Laboratory Analysis</span>
                            </div>
                            <div className="flex flex-col items-center gap-1">
                                <span className="font-black text-lg">MIDTERM EXAM</span>
                                <span className="text-[10px]">3rd Stage</span>
                            </div>
                            <div className="flex flex-col items-end gap-1">
                                <span className="font-bold">SUBJECT: {exam.subject}</span>
                                <span className="text-[10px]">Date: {new Date().toLocaleDateString()}</span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="space-y-6">
                                <h5 className="text-xs uppercase text-center text-slate-800 font-black border-b border-slate-400 pb-2 mb-4">{T.bubbleLeft}</h5>
                                <div className="grid grid-cols-1 gap-6">
                                    {cleanQuestions.map((q, idx) => q.options.length > 2 && (
                                        <div key={idx} className="flex items-center justify-center gap-6">
                                            <span className="text-sm font-bold w-6 text-slate-900 text-right">{idx + 1}</span>
                                            <div className="flex gap-4">
                                                {q.options.map((_, oIdx) => (
                                                    <div key={oIdx} className="flex flex-col items-center">
                                                        <span className="bubble-label">{String.fromCharCode(65 + oIdx)}</span>
                                                        <div onClick={() => setAnswers(prev => { let n = [...prev]; n[idx] = oIdx; return n; })} className={`bubble ${answers[idx] === oIdx ? 'active' : ''}`}>
                                                            {String.fromCharCode(65 + oIdx)}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-6 md:border-r-2 md:border-slate-300 md:pr-10">
                                <h5 className="text-xs uppercase text-center text-slate-800 font-black border-b border-slate-400 pb-2 mb-4">{T.bubbleRight}</h5>
                                <div className="grid grid-cols-1 gap-6">
                                    {cleanQuestions.map((q, idx) => q.options.length <= 2 && (
                                        <div key={idx} className="flex items-center justify-center gap-6">
                                            <span className="text-sm font-bold w-6 text-slate-900 text-right">{idx + 1}</span>
                                            <div className="flex gap-8">
                                                <div className="flex flex-col items-center">
                                                    <span className="bubble-label text-slate-800 font-black">T</span>
                                                    <div onClick={() => setAnswers(prev => { let n = [...prev]; n[idx] = 0; return n; })} className={`bubble ${answers[idx] === 0 ? 'active' : ''}`}>
                                                        T
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-center">
                                                    <span className="bubble-label text-slate-800 font-black">F</span>
                                                    <div onClick={() => setAnswers(prev => { let n = [...prev]; n[idx] = 1; return n; })} className={`bubble ${answers[idx] === 1 ? 'active' : ''}`}>
                                                        F
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="mt-12 pt-8 border-t-2 border-slate-400">
                            <button onClick={submit} disabled={loading || answers.includes(null)} className={`w-full py-5 rounded-2xl font-bold text-xl transition-all shadow-lg ${answers.includes(null) ?
                                'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-black text-white hover:scale-[1.01]'}`}>
                                {loading ? '...' : T.submitBubble}
                            </button>
                            <button onClick={exit} className="w-full mt-4 text-slate-500 font-bold hover:text-slate-800">{T.back}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Leaderboard = ({ T, setView, user }) => {
            const [data, setData] = useState([]);
            const [exams, setExams] = useState([]);
            const [activeSubject, setActiveSubject] = useState('');

            useEffect(() => {
                const qExams = window.FB.query(window.FB.collection(window.FB.db, "exams"), window.FB.orderBy("timestamp", "desc"));
                const unsubExams = window.FB.onSnapshot(qExams, (snap) => {
                    const cur = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setExams(cur); if (cur.length > 0 && !activeSubject) setActiveSubject(cur[0].subject);
                });
                const qScores = window.FB.query(window.FB.collection(window.FB.db, "classroom"), window.FB.orderBy("score", "desc"));
                const unsubScores = window.FB.onSnapshot(qScores, (snap) => {
                    const raw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const filteredMap = new Map();
                    const attempts = new Map();
                    raw.forEach(item => {
                        const key = `${item.student}_${item.subject}`;
                        attempts.set(key, (attempts.get(key) || 0) + 1);
                        if (!filteredMap.has(key) || filteredMap.get(key).score < item.score) filteredMap.set(key, item);
                    });
                    setData(Array.from(filteredMap.values()).map(i => ({ ...i, realAttempts: attempts.get(`${i.student}_${i.subject}`) })));
                });
                return () => { unsubExams(); unsubScores(); };
            }, []);

            const filtered = data.filter(d => d.subject === activeSubject).sort((a, b) => b.score - a.score || a.totalTimes - b.totalTimes);

            return (
                <div className="card-glow rounded-3xl p-8 w-full overflow-hidden">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                        <h2 className="text-xl font-bold">{T.menuLeader}</h2>
                        <button onClick={() => setView('dashboard')} className="font-bold text-slate-400">{T.back}</button>
                    </div>
                    <div className="flex gap-2 overflow-x-auto pb-4 mb-6">
                        {exams.map(e => <button key={e.id} onClick={() => setActiveSubject(e.subject)} className={`px-4 py-2 rounded-xl text-sm font-bold border transition-all ${activeSubject === e.subject ? 'bg-emerald-800 border-emerald-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-500'}`}>{e.subject}</button>)}
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-right border-separate border-spacing-y-3">
                            <thead><tr className="text-xs font-bold text-slate-500"><th className="px-4 py-2">#</th><th className="px-4 py-2">الاسم</th><th className="px-4 py-2">{T.score}</th><th className="px-4 py-2">{T.attempts}</th><th className="px-4 py-2">الوقت (ث)</th></tr></thead>
                            <tbody>
                                {filtered.map((item, i) => (
                                    <tr key={item.id} className={`${i <= 2 ? 'rank-gold' : 'rank-silver'} rounded-2xl`}>
                                        <td className="px-4 py-4 first:rounded-r-2xl"><span className="inline-flex items-center justify-center w-8 h-8 rounded-lg rank-number font-black">{i + 1}</span></td>
                                        <td className="px-4 py-4 font-bold">{item.student}</td>
                                        <td className="px-4 py-4 font-black text-lg">{item.score}/{item.total}</td>
                                        <td className="px-4 py-4 font-bold">{item.realAttempts}</td>
                                        <td className="px-4 py-4 last:rounded-l-2xl font-mono">{Math.round(item.totalTimes)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
